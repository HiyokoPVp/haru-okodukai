<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学校に行ってはるにお金を上げよう</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #4a90e2;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            margin-bottom: 8px;
            font-weight: normal;
        }

        .tabs {
            display: flex;
            background: #fafafa;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            background: #fafafa;
            border: none;
            font-size: 15px;
            font-weight: normal;
            transition: all 0.2s;
        }

        .tab.active {
            background: white;
            color: #333;
            border-bottom: 2px solid #4a90e2;
        }

        .tab:hover {
            background: #f0f0f0;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8f8f8;
            color: #333;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        .stat-card h3 {
            font-size: 13px;
            margin-bottom: 10px;
            color: #666;
            font-weight: normal;
        }

        .stat-card .value {
            font-size: 28px;
            font-weight: normal;
            color: #333;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .calendar-header {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .calendar-day {
            aspect-ratio: 1;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            background: white;
        }

        .calendar-day:hover {
            background: #f9f9f9;
            border-color: #4a90e2;
        }

        .calendar-day.disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .calendar-day.disabled:hover {
            background: white;
            border-color: #ddd;
        }

        .calendar-day .date {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .calendar-day.attended {
            background: #d4edda;
            border-color: #28a745;
        }

        .calendar-day.on-time {
            background: #fff3cd;
            border-color: #ffc107;
        }

        .stamp {
            font-size: 24px;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: normal;
        }

        .btn-primary {
            background: #4a90e2;
            color: white;
        }

        .btn-primary:hover {
            background: #357abd;
        }

        .btn-success {
            background: #5cb85c;
            color: white;
        }

        .btn-success:hover {
            background: #4cae4c;
        }

        .btn-danger {
            background: #d9534f;
            color: white;
        }

        .btn-danger:hover {
            background: #c9302c;
        }

        .disney-progress {
            margin-top: 30px;
            padding: 20px;
            background: #fef5e7;
            border-radius: 8px;
            border: 1px solid #f9e79f;
        }

        .disney-progress h2 {
            color: #333;
        }

        .disney-progress p {
            color: #666;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: #4a90e2;
            transition: width 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: normal;
            color: white;
        }

        .disney-stamps {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .disney-stamp {
            aspect-ratio: 1;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #f5f5f5;
        }

        .disney-stamp.earned {
            background: white;
            border-color: #4a90e2;
        }

        .month-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .month-nav h2 {
            font-size: 20px;
        }

        .nav-btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-btn:hover {
            background: #357abd;
        }

        .legend {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            border: 2px solid #dee2e6;
        }

        .legend-box.attended {
            background: #d4edda;
            border-color: #28a745;
        }

        .legend-box.on-time {
            background: #fff3cd;
            border-color: #ffc107;
        }

        /* 📋 アップデートログ用追加スタイル */
        .log-container {
            padding: 20px;
            background: #fafafa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .log-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ddd;
        }

        .log-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .log-version {
            font-weight: bold;
            color: #4a90e2;
            font-size: 16px;
        }

        .log-text {
            color: #555;
            margin-top: 5px;
            font-size: 14px;
        }

        /* 📱 スマートフォン向けのスタイル調整（レスポンシブ） */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 18px;
            }

            .tab-content {
                padding: 15px 10px;
            }

            .stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                margin-bottom: 20px;
            }

            .stats .stat-card:nth-child(3) {
                grid-column: span 2;
            }

            .stat-card {
                padding: 12px;
            }

            .stat-card .value {
                font-size: 22px;
            }

            .calendar {
                gap: 4px;
            }

            .calendar-header {
                padding: 6px 0;
                font-size: 12px;
            }

            .calendar-day .date {
                font-size: 11px;
                margin-bottom: 2px;
            }

            .stamp {
                font-size: 16px;
            }

            .disney-stamps {
                grid-template-columns: repeat(5, 1fr);
                gap: 6px;
            }

            .disney-stamp {
                font-size: 16px;
            }

            .controls {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                width: 100%;
                padding: 12px;
                font-size: 15px;
            }

            .legend {
                gap: 10px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎓 学校に行ってはるにお金を上げよう 💰</h1>
            <p>頑張って登校してスタンプを集めよう！</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('stamps', this)">スタンプ帳</button>
            <button class="tab" onclick="switchTab('disney', this)">ディズニー目標</button>
            <button class="tab" onclick="switchTab('logs', this)">アップデートログ</button>
        </div>

        <div id="stamps" class="tab-content active">
            <div class="stats">
                <div class="stat-card">
                    <h3>現在のスタンプ</h3>
                    <div class="value" id="currentStamps">0</div>
                </div>
                <div class="stat-card">
                    <h3>交換可能金額</h3>
                    <div class="value" id="currentMoney">¥0</div>
                </div>
                <div class="stat-card">
                    <h3>累計登校日数</h3>
                    <div class="value" id="totalDays">0</div>
                </div>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-box attended"></div>
                    <span>登校（1スタンプ）</span>
                </div>
                <div class="legend-item">
                    <div class="legend-box on-time"></div>
                    <span>遅刻なし（1.5スタンプ）</span>
                </div>
            </div>

            <div class="month-nav">
                <button class="nav-btn" onclick="changeMonth(-1)">← 前月</button>
                <h2 id="currentMonth"></h2>
                <button class="nav-btn" onclick="changeMonth(1)">次月 →</button>
            </div>

            <div class="calendar" id="calendar"></div>

            <div class="controls">
                <button class="btn btn-success" onclick="exchangeStamps()" id="exchangeBtn">
                    10スタンプを¥1500に交換
                </button>
                <button class="btn btn-danger" onclick="resetData()">
                    データリセット
                </button>
            </div>
        </div>

        <div id="disney" class="tab-content">
            <div class="disney-progress">
                <h2 style="text-align: center; margin-bottom: 10px;">🏰 ディズニー目標 🏰</h2>
                <p style="text-align: center; margin-bottom: 20px;">30回学校に行くとディズニーに行けるよ！</p>
                
                <div class="progress-bar">
                    <div class="progress-fill" id="disneyProgress">0/30</div>
                </div>

                <div class="disney-stamps" id="disneyStamps"></div>

                <div style="text-align: center; margin-top: 20px; font-size: 16px; color: #666;">
                    <p>あと <span id="remainingDays" style="font-size: 24px; font-weight: normal; color: #333;">30</span> 日</p>
                </div>
            </div>
        </div>

        <!-- 📋 アップデートログ用のコンテンツ -->
        <div id="logs" class="tab-content">
            <div class="log-container">
                <h2 style="text-align: center; margin-bottom: 20px;">📋 アップデートログ 📋</h2>
                <div class="log-item">
                    <div class="log-version">ver 1.1</div>
                    <div class="log-text">モバイルのUIとLocalstorageを修正した</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let attendanceData = {};
        let exchangedStamps = 0;

        // データの読み込み
        function loadData() {
            const saved = localStorage.getItem('schoolStampData');
            if (saved) {
                const data = JSON.parse(saved);
                attendanceData = data.attendance || {};
                exchangedStamps = data.exchanged || 0;
            }
        }

        // データの保存
        function saveData() {
            localStorage.setItem('schoolStampData', JSON.stringify({
                attendance: attendanceData,
                exchanged: exchangedStamps
            }));
        }

        // タブ切り替え
        function switchTab(tabName, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            element.classList.add('active');
            document.getElementById(tabName).classList.add('active');

            if (tabName === 'disney') {
                updateDisneyProgress();
            }
        }

        // カレンダー表示
        function renderCalendar() {
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
            document.getElementById('currentMonth').textContent = `${currentYear}年 ${monthNames[currentMonth]}`;

            const weekDays = ['日', '月', '火', '水', '木', '金', '土'];
            weekDays.forEach(day => {
                const header = document.createElement('div');
                header.className = 'calendar-header';
                header.textContent = day;
                calendar.appendChild(header);
            });

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            for (let i = 0; i < firstDay; i++) {
                const empty = document.createElement('div');
                calendar.appendChild(empty);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';
                
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const dateObj = new Date(currentYear, currentMonth, day);
                dateObj.setHours(0, 0, 0, 0);
                
                const isFuture = dateObj > today;

                if (isFuture) {
                    dayEl.classList.add('disabled');
                }

                dayEl.innerHTML = `<div class="date">${day}</div>`;

                if (attendanceData[dateStr]) {
                    const type = attendanceData[dateStr];
                    if (type === 'ontime') {
                        dayEl.classList.add('on-time');
                        dayEl.innerHTML += '<div class="stamp">⭐</div>';
                    } else {
                        dayEl.classList.add('attended');
                        dayEl.innerHTML += '<div class="stamp">✓</div>';
                    }
                }

                if (!isFuture) {
                    dayEl.onclick = () => toggleAttendance(dateStr, dayEl);
                }

                calendar.appendChild(dayEl);
            }

            updateStats();
        }

        // 出席切り替え
        function toggleAttendance(dateStr, element) {
            if (!attendanceData[dateStr]) {
                attendanceData[dateStr] = 'attended';
            } else if (attendanceData[dateStr] === 'attended') {
                attendanceData[dateStr] = 'ontime';
            } else {
                delete attendanceData[dateStr];
            }
            saveData();
            renderCalendar();
            updateDisneyProgress();
        }

        // 統計更新
        function updateStats() {
            let totalStamps = 0;
            let totalDays = 0;

            for (const date in attendanceData) {
                totalDays++;
                if (attendanceData[date] === 'ontime') {
                    totalStamps += 1.5;
                } else {
                    totalStamps += 1;
                }
            }

            const availableStamps = totalStamps - exchangedStamps;

            document.getElementById('currentStamps').textContent = availableStamps.toFixed(1);
            document.getElementById('currentMoney').textContent = `¥${Math.floor(availableStamps / 10) * 1500}`;
            document.getElementById('totalDays').textContent = totalDays;

            const exchangeBtn = document.getElementById('exchangeBtn');
            if (availableStamps < 10) {
                exchangeBtn.disabled = true;
                exchangeBtn.style.opacity = '0.5';
                exchangeBtn.style.cursor = 'not-allowed';
            } else {
                exchangeBtn.disabled = false;
                exchangeBtn.style.opacity = '1';
                exchangeBtn.style.cursor = 'pointer';
            }
        }

        // スタンプ交換
        function exchangeStamps() {
            let totalStamps = 0;
            for (const date in attendanceData) {
                if (attendanceData[date] === 'ontime') {
                    totalStamps += 1.5;
                } else {
                    totalStamps += 1;
                }
            }

            const availableStamps = totalStamps - exchangedStamps;

            if (availableStamps >= 10) {
                const exchangeCount = Math.floor(availableStamps / 10);
                exchangedStamps += exchangeCount * 10;
                const money = exchangeCount * 1500;
                
                alert(`🎉 ${exchangeCount * 10}スタンプを¥${money}に交換しました！\nおめでとう！`);
                saveData();
                renderCalendar();
            } else {
                alert('スタンプが足りません。10スタンプ必要です。');
            }
        }

        // 月移動
        function changeMonth(direction) {
            currentMonth += direction;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            } else if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar();
        }

        // ディズニー進捗更新
        function updateDisneyProgress() {
            const totalDays = Object.keys(attendanceData).length;
            const progress = Math.min(totalDays, 30);
            const percentage = (progress / 30) * 100;

            const progressEl = document.getElementById('disneyProgress');
            if (progressEl) {
                progressEl.style.width = percentage + '%';
                progressEl.textContent = `${progress}/30`;
            }
            
            const remainingEl = document.getElementById('remainingDays');
            if (remainingEl) {
                remainingEl.textContent = Math.max(0, 30 - totalDays);
            }

            const stampsContainer = document.getElementById('disneyStamps');
            if (stampsContainer) {
                stampsContainer.innerHTML = '';
                for (let i = 0; i < 30; i++) {
                    const stamp = document.createElement('div');
                    stamp.className = 'disney-stamp';
                    if (i < totalDays) {
                        stamp.classList.add('earned');
                        stamp.textContent = '🏰';
                    }
                    stampsContainer.appendChild(stamp);
                }
            }

            if (totalDays >= 30) {
                setTimeout(() => {
                    alert('🎉🏰 おめでとう！ディズニーに行けるよ！🏰🎉');
                }, 100);
            }
        }

        // データリセット
        function resetData() {
            if (confirm('本当にすべてのデータをリセットしますか？')) {
                localStorage.removeItem('schoolStampData');
                attendanceData = {};
                exchangedStamps = 0;
                saveData();
                renderCalendar();
                updateDisneyProgress();
                alert('データをリセットしました。');
            }
        }

        // 初期化
        loadData();
        renderCalendar();
        updateDisneyProgress();
    </script>
</body>
</html>
